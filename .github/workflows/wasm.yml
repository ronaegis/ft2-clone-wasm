name: WASM build

on:
  push:
    paths: ['src/**', 'wasm/**', '.github/workflows/wasm.yml']
  pull_request:
    paths: ['src/**', 'wasm/**', '.github/workflows/wasm.yml']

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 5.0.2 # keep in sync with wasm/build/build-wasm.sh

      - name: Build
        working-directory: wasm/build
        run: ./build-wasm.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Smoke test
        working-directory: wasm/tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test

      - uses: actions/upload-pages-artifact@v3
        with:
          path: wasm/web

  # Publish the tested build to GitHub Pages
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
